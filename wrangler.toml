name = "korali-de-michele-demo"
main = "worker.js"
compatibility_date = "2026-09-23"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[routes]]
pattern = "koralidigital.com/demos/de-michele/*"
zone_name = "koralidigital.com"

[[routes]]
pattern = "www.koralidigital.com/demos/de-michele/*"
zone_name = "koralidigital.com"
